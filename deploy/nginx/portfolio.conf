# ============================================================================
# Virtual Host Nginx — Aplikasi Laravel Portfolio
# Lokasi target di server : /etc/nginx/sites-available/portfolio
# Path aplikasi           : /var/www/portfolio
# PHP                     : PHP 8.2 FPM (socket /var/run/php/php8.2-fpm.sock)
#
# Aktifkan dengan:
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Catatan: setelah SSL aktif via `sudo certbot --nginx`, certbot akan
# menambahkan blok server 443 + redirect otomatis di file ini.
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain milik Anda:
    server_name portfolio.example.com www.portfolio.example.com;

    # Document root Laravel WAJIB mengarah ke folder public/
    root /var/www/portfolio/public;
    index index.php index.html;

    charset utf-8;

    # Batas upload (thumbnail proyek maks 2MB di sisi aplikasi;
    # 20M memberi ruang untuk kebutuhan lain di kemudian hari).
    client_max_body_size 20M;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Aktifkan HSTS HANYA setelah HTTPS stabil (salakan baris bawah):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Sembunyikan versi Nginx
    server_tokens off;

    # ------------------------------------------------------------------
    # Kompresi
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ------------------------------------------------------------------
    # URL rewriting utama Laravel
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------------------------
    # Lokasi storage/ (file publik hasil storage:link)
    # - PHP tidak boleh dieksekusi di sini
    # ------------------------------------------------------------------
    location ^~ /storage/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        location ~* \.(php\d*|phtml|phar)$ { deny all; }
        try_files $uri =404;
    }

    # Aset statis hasil build Vite (fingerprint nama file → cache agresif)
    location ~* ^/build/ {
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # File statis umum
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff2?|ttf)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Proteksi file sensitif
    # ------------------------------------------------------------------
    # Dotfiles tersembunyi (termasuk .env, .git) — kecuali .well-known (ACME)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # File backup / editor / log yang kadang tak sengaja ikut ter-commit
    location ~*.(?:bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|orig)$ {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ------------------------------------------------------------------
    # PHP-FPM
    # ------------------------------------------------------------------
    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param HTTP_HOST $host;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
